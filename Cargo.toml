[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.8"
chrono = { version = "0.4.43", features = ["serde"] }
error_set = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sql_traits = { path = "./crates/sql_traits" }
sqlx = { version = "0.8.6", features = ["postgres"] }
