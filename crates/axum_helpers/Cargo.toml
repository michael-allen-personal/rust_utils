[package]
name = "axum_helpers"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
error_set = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sql_traits = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
# Consumer-perspective compile test for the route derive macros. `axum_helpers` (the
# crate under test) and `macros` are the ONLY dependencies visible to the test crate —
# no direct serde/sqlx/sql_traits — proving the derive output is self-contained.
macros = { path = "../macros" }
