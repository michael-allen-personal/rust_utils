[package]
name = "axum_helpers"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
axum_helpers_macros = { workspace = true }
chrono = { workspace = true }
error_set = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sql_traits = { workspace = true }
sqlx = { workspace = true }

# Forwarded to `sql_traits` and `sqlx` together, so a consumer enabling a driver here gets
# it in both. No default, for the same reason `sql_traits` has none.
[features]
postgres = ["sql_traits/postgres", "sqlx/postgres"]
sqlite = ["sql_traits/sqlite", "sqlx/sqlite"]
mysql = ["sql_traits/mysql", "sqlx/mysql"]
any = ["sql_traits/any", "sqlx/any"]

[dev-dependencies]
# Only `tests/route_responses.rs` needs a runtime, to await a handler and read the status
# code it answers with. The other test crates are compile-and-mount assertions.
tokio = { workspace = true }
# `tests/route_responses.rs` drives a `Router` with a real request, which is the only way to
# exercise axum's URL-segment binding: calling a handler directly takes a `Path` that was
# built by hand, so it proves nothing about which segment filled which field. Spelled the way
# axum spells its own dependency on it, so dev-dep feature unification cannot pull in extras.
tower = { workspace = true }
# Enables both drivers plus a runtime for test builds only. The library deliberately picks
# neither a driver nor a runtime in `[dependencies]`, leaving both to the consumer. Both
# drivers are needed, not one: `tests/route_traits.rs` carries a Postgres fixture (`Gadget`)
# and a SQLite fixture (`Sprocket`), mounting both on real routers, which is what proves the
# route traits follow each record's own `HasDatabase` rather than being tied to one driver.
# The runtime backs the real in-memory SQLite databases `tests/route_responses.rs` builds
# and queries.
sqlx = { workspace = true, features = ["postgres", "sqlite", "runtime-tokio"] }
