[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
error_set = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sql_traits = { path = "./crates/sql_traits" }
sqlx = { version = "0.8", features = ["postgres"] }
