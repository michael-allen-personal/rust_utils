[package]
name = "sql_traits"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
# Consumer-perspective compile tests for the derive macros. `serde` is deliberately absent:
# the tests reach it through this crate's own re-export (`sql_traits::serde`), so it never
# enters the test crates' extern prelude and `tests/derive_macros.rs` still proves the
# generated paths resolve without a direct `serde`/`sqlx`/`sql_traits`-by-name dependency.
macros = { path = "../macros" }
serde_json = { workspace = true }
